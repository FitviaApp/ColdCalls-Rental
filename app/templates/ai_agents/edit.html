{% extends "base.html" %}

{% block title %}Edit AI Agent - ColdCalls Platform{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Edit AI Agent</h1>
        <p class="text-gray-500">Update the prompt, voice, and handoff rules for this agent.</p>
    </div>

    {% if error %}
    <div class="mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded">
        {{ error }}
    </div>
    {% endif %}

    <form action="/ai-agents/{{ agent.id }}/edit" method="POST" class="space-y-6">
        {% include "ai_agents/_form.html" %}
        <div class="flex justify-end space-x-3">
            <a href="/ai-agents" class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">Cancel</a>
            <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
